# Compila no Mac do GitHub (grátis em repositório público): roda os testes e
# gera um .ipa SEM assinatura. Quem assina é o Sideloadly, no Windows, com o
# seu Apple ID — ver README.md, "Instalar no iPhone sem Mac".
name: ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

# Para publicar o .ipa como release (o botão de download da página).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar o projeto do Xcode
        run: |
          brew install xcodegen
          xcodegen

      - name: Testes
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulador: $SIM"
          xcodebuild test -project GmailCleanerBuddy.xcodeproj -scheme GmailCleanerBuddy \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO | tail -40
          exit ${PIPESTATUS[0]}

      - name: Compilar para iPhone (sem assinatura)
        run: |
          xcodebuild build -project GmailCleanerBuddy.xcodeproj -scheme GmailCleanerBuddy \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -40
          exit ${PIPESTATUS[0]}

      - name: Empacotar o .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GmailCleanerBuddy.app Payload/
          zip -qr GmailCleanerBuddy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GmailCleanerBuddy-ipa
          path: GmailCleanerBuddy.ipa

      # Release "latest" fixa: o link releases/latest/download/GmailCleanerBuddy.ipa
      # da página (index.html) baixa sem precisar de conta no GitHub.
      - name: Publicar o .ipa na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GmailCleanerBuddy.ipa             --title "Gmail Cleaner Buddy para iPhone (build ${GITHUB_SHA::7})"             --notes "IPA sem assinatura. Instale com o Sideloadly: https://mbastida43.github.io/gmailcleanerbuddyapp_ios/#install"
